# Keeps vn.rsc in sync with ipdeny's Vietnam IPv4 list.
# Save this file in your repo as: .github/workflows/update-vn.yml
name: Update VN list

on:
  schedule:
    - cron: "23 3 * * *"   # every day at 03:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build vn.rsc from ipdeny
        run: |
          python3 - <<'PY'
          import ipaddress, os, sys, time, urllib.request

          URL = "https://www.ipdeny.com/ipblocks/data/aggregated/vn-aggregated.zone"
          OUT = "vn.rsc"
          REPO = os.environ.get("GITHUB_REPOSITORY", "USER/REPO")
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")

          HEADER = """# IP-VN: Vietnam IPv4 address list for MikroTik RouterOS
          # Source: https://www.ipdeny.com/ipblocks/data/aggregated/vn-aggregated.zone
          # Networks: @COUNT@
          #
          # Run on the router:
          #   /tool fetch url="https://raw.githubusercontent.com/@REPO@/@BRANCH@/vn.rsc" mode=https dst-path=vn.rsc
          #   /import file-name=vn.rsc
          #
          # The import loads every network into a temporary list (IP-VN-new), then syncs the list IP-VN:
          # new networks are added, and networks tagged with comment ipdeny-vn that are no longer
          # listed are removed. Entries with any other comment (for example added by hand) are never touched.
          /ip firewall address-list remove [find list="IP-VN-new"]"""

          FOOTER = """{
              :local listName "IP-VN"
              :local tmpName "IP-VN-new"
              :local tag "ipdeny-vn"
              :local expected @COUNT@

              :local total [:len [/ip firewall address-list find list=$tmpName]]
              :if ($total != $expected) do={
                  /ip firewall address-list remove [find list=$tmpName]
                  :error ("IP-VN: import incomplete (" . $total . " of " . $expected . "), nothing changed")
              }

              :local added 0
              :local removed 0

              # add networks that are new
              :foreach i in=[/ip firewall address-list find list=$tmpName] do={
                  :local a [/ip firewall address-list get $i address]
                  :if ([:len [/ip firewall address-list find list=$listName address=$a]] = 0) do={
                      /ip firewall address-list add list=$listName address=$a comment=$tag
                      :set added ($added + 1)
                  }
              }

              # remove networks that are gone from the source
              :foreach i in=[/ip firewall address-list find list=$listName comment=$tag] do={
                  :local a [/ip firewall address-list get $i address]
                  :if ([:len [/ip firewall address-list find list=$tmpName address=$a]] = 0) do={
                      /ip firewall address-list remove $i
                      :set removed ($removed + 1)
                  }
              }

              /ip firewall address-list remove [find list=$tmpName]
              :local msg ("IP-VN synced: " . $expected . " networks, " . $added . " added, " . $removed . " removed")
              :log info $msg
              :put $msg
          }"""

          # 1) download (3 tries)
          data = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(URL, headers={"User-Agent": "vn-rsc-updater"})
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = resp.read().decode("utf-8", "replace")
                  break
              except Exception as exc:
                  print("download attempt %d failed: %s" % (attempt, exc))
                  time.sleep(10)
          if data is None:
              sys.exit("download failed")

          # 2) keep only valid IPv4 networks (no host bits set, prefix /8 or longer), no duplicates
          nets = set()
          for line in data.splitlines():
              try:
                  net = ipaddress.ip_network(line.strip(), strict=True)
              except ValueError:
                  continue
              if net.version == 4 and net.prefixlen >= 8:
                  nets.add(net)
          nets = sorted(nets)
          count = len(nets)

          # 3) safety checks: never publish an empty or suspiciously small list
          if count < 500:
              sys.exit("only %d valid networks - refusing to update" % count)
          old = 0
          if os.path.exists(OUT):
              with open(OUT) as f:
                  old = sum(1 for l in f if l.startswith("/ip firewall address-list add "))
          if old and count * 10 < old * 7:
              sys.exit("list shrank from %d to %d - refusing to update" % (old, count))

          # 4) write vn.rsc
          lines = [HEADER]
          lines += ["/ip firewall address-list add address=%s list=IP-VN-new" % n for n in nets]
          lines.append(FOOTER)
          text = "\n".join(lines) + "\n"
          text = text.replace("@COUNT@", str(count)).replace("@REPO@", REPO).replace("@BRANCH@", BRANCH)
          with open(OUT, "w", newline="\n") as f:
              f.write(text)
          print("wrote %s: %d networks (was %d)" % (OUT, count, old))
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vn.rsc
          if ! git diff --cached --quiet; then
            git commit -m "Update VN list $(date -u +%F)"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            # Nothing changed for a long time: add an empty commit so GitHub does not pause the schedule.
            git commit --allow-empty -m "Keepalive $(date -u +%F)"
            git push
          fi
